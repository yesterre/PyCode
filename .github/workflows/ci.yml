name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pycode_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pycode_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/pycode_test
      REDIS_URL: redis://127.0.0.1:6379/15
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Configure ephemeral API signing key
        run: |
          python - <<'PY'
          import os, secrets
          value = secrets.token_urlsafe(48)
          print(f"::add-mask::{value}")
          with open(os.environ["GITHUB_ENV"], "a") as stream:
              stream.write(f"PYCODE_JWT_SECRET={value}\n")
          PY
      - name: Initialize PostgreSQL test schema
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: python -m alembic upgrade head
      - name: Validate backend runtime configuration
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: python -m backend.check_config --role api
      - name: Run backend and core tests
        run: python -m pytest --basetemp=.pytest_tmp_ci -o cache_dir=.pytest_tmp_ci/.pytest_cache --tb=short

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build frontend
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      PYTHON_DOTENV_DISABLED: "1"
      PYCODE_EMBEDDING_ENABLED: "false"
      PYCODE_RETRIEVAL_MODE: keyword
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Create root virtual environment and install backend dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium and system dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Verify clean browser server initialization
        run: .venv/bin/python -m pytest tests/test_phase8_browser_server.py --basetemp=.tmp/e2e-init -o cache_dir=.tmp/e2e-pytest-cache --tb=short
      - name: Run browser workflows
        working-directory: frontend
        run: npm run e2e
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: warn
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and verify isolated Compose deployment
        run: python -m scripts.deploy.smoke
      - name: Upload deployment diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-diagnostics
          path: |
            docs_v3.0/v3_backend/B15_compose_*.json
            docs_v3.0/v3_backend/B15_command_failure_*.log
          if-no-files-found: ignore
          retention-days: 7
