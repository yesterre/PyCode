[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pycode-agent-demo"
version = "0.1.0"
description = "PyCode demo: Python codebase understanding and development-analysis Agent."
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0,<2.0",
    "rich>=13.0",
    "streamlit>=1.57",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "httpx>=0.28,<1.0",
]
backend = [
    "fastapi>=0.140,<1.0",
    "pydantic>=2.9,<3.0",
    "uvicorn>=0.30,<1.0",
]

[project.scripts]
pycode = "pycode.cli:main"

[tool.setuptools.packages.find]
include = ["pycode*", "ui*", "backend*"]
